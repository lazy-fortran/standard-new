main = "pdfcanonical.f90"

[[executable]]
name = "pdfproductions"
source-dir = "app"
main = "pdfproductions.f90"

[[executable]]
name = "pdfstandardir"
source-dir = "app"
main = "pdfstandardir.f90"

[[executable]]
